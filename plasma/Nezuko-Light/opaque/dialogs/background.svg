<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="opaqueGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE4F0"/>
    </linearGradient>
  </defs>

  <!-- Opaque dialog background with small edge curve and outline -->
  <rect x="0" y="0" width="256" height="256" rx="20" ry="20"
        fill="url(#opaqueGradient)"
        stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
</svg>