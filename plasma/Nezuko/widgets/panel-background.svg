<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48">
  <defs>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A3A"/>
      <stop offset="100%" stop-color="#2E2A2E"/>
    </linearGradient>
  </defs>

  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Text{color:#2E2A2A}
    .ColorScheme-Highlight{color:#FF69B4}
    .ColorScheme-ViewBackground{color:#3A2A3A}
    .ColorScheme-ViewText{color:#FFFFFF}
    .ColorScheme-ButtonText{color:#2E2A2A}
    .ColorScheme-ButtonBackground{color:#FFB6D2}
    .ColorScheme-ButtonHover{color:#FF69B4}
    .ColorScheme-ViewHover{color:#FF69B4}
    .ColorScheme-ViewFocus{color:#FF69B4}
    .ColorScheme-Background{color:#2E2A2A}
  </style>

  <!-- Solid panel with slight edge curve and outline, Breeze-like -->
  <rect x="0" y="0" width="200" height="48" rx="10" ry="10"
        fill="url(#panelGradient)"
        stroke="#1A1A1A" stroke-width="1.5"/>
</svg>